name: self test

on:
  push:
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14] # macos-latest it not ready
        provider: [docker, davidkhala]
    runs-on: ${{matrix.os}}
    steps:
    - uses: actions/checkout@main
    - uses: ./
      with:
        action-provider: ${{matrix.provider}}
    - run: docker context ls
